[package]
name = "simple-signal-core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
argon2 = "0.5"
thiserror = "1.0"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
rand = "0.8"
rusqlite = { version = "0.40", features = ["bundled-sqlcipher"] }
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
hkdf = "0.12"
aes-gcm = "0.10"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
fips203 = "0.4"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
arti-client = { version = "0.47", default-features = false, features = ["tokio", "rustls", "onion-service-client", "bridge-client"] }
# Direct dep so the core can install a Rustls CryptoProvider before Arti
# bootstraps; without it Arti panics ("Could not automatically determine
# the process-level CryptoProvider"). Ring is already in the lockfile.
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12"] }
# HTTPS-over-Tor exit fallback (Ticket 26.3 remainder).
tokio-rustls = "0.26"
webpki-roots = "1.0"
tor-rtcompat = { version = "0.47", default-features = false, features = ["tokio", "rustls"] }
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.40", features = ["bundled-sqlcipher"] }


