name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd apps/simple_signal_mobile
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd apps/simple_signal_mobile
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleSignal-APK
          path: apps/simple_signal_mobile/build/app/outputs/flutter-apk/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Simple+Signal Continuous Release' }}
          draft: false
          prerelease: false
          files: apps/simple_signal_mobile/build/app/outputs/flutter-apk/*.apk
          body: |
            ### Simple+Signal Anonymous Messaging APK
            - **Post-Quantum Cryptography:** NIST FIPS 203 ML-KEM-1024 + Signal Double Ratchet
            - **Routing:** Unidirectional pairwise queues over Tor v3 Onion Relays
            - **Storage:** Local encrypted SQLite with Argon2id master key derivation
            - **Direct Download:** Download and install the `.apk` file below on any Android device.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
