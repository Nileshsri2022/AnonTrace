name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository with Tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Tag Message for Release Body
        id: extract_tag
        run: |
          # Extract the exact message provided during tagging (e.g. git tag -a v1.0.0 -m "My Message")
          MSG=$(git tag -l --format='%(contents)' ${{ github.ref_name }})
          if [ -z "$MSG" ]; then
            MSG=$(git log -1 --pretty=%B)
          fi
          echo "RELEASE_BODY<<EOF" >> $GITHUB_ENV
          echo "$MSG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd apps/simple_signal_mobile
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd apps/simple_signal_mobile
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleSignal-${{ github.ref_name }}-APK
          path: apps/simple_signal_mobile/build/app/outputs/flutter-apk/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Simple+Signal ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: apps/simple_signal_mobile/build/app/outputs/flutter-apk/*.apk
          body: ${{ env.RELEASE_BODY }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
