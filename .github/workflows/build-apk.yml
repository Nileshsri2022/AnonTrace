name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Default to read-only permissions.
permissions:
  contents: read

# Avoid overlapping builds for the same ref.
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-C debuginfo=0"

jobs:
  verify:
    name: Verify & Test (Rust & Flutter)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/simple-signal-core -> target

      - name: Test Rust Core
        working-directory: crates/simple-signal-core
        run: cargo test --locked

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter Dependencies
        working-directory: apps/simple_signal_mobile
        run: flutter pub get

      - name: Run Flutter Tests
        working-directory: apps/simple_signal_mobile
        run: flutter test

  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository with Tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Locate Android NDK
        run: |
          NDK_DIR=$(find $ANDROID_HOME/ndk -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$NDK_DIR" ]; then
            echo "::error::No Android NDK found in $ANDROID_HOME/ndk"
            exit 1
          fi
          echo "Using Android NDK: $NDK_DIR"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Setup Rust and Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/simple-signal-core -> target

      - name: Cache cargo-ndk
        id: cache-cargo-ndk
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: ${{ runner.os }}-cargo-ndk-v3

      - name: Install cargo-ndk
        if: steps.cache-cargo-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --locked

      - name: Compile Rust Core for Android
        working-directory: crates/simple-signal-core
        run: |
          set -euo pipefail

          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -o ../../apps/simple_signal_mobile/android/app/src/main/jniLibs \
            build --release --locked

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter Dependencies
        working-directory: apps/simple_signal_mobile
        run: flutter pub get

      - name: Configure Android Signing Keystore
        shell: bash
        working-directory: apps/simple_signal_mobile/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "Configuring release signing keystore from secret..."
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release.jks\n" \
              "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > key.properties
          else
            echo "Generating release signing keystore for automated release..."
            keytool -genkeypair -v \
              -keystore release.jks \
              -alias anontrace \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass anontrace123 \
              -keypass anontrace123 \
              -dname "CN=AnonTrace, OU=AnonTrace, O=AnonTrace, L=Unknown, ST=Unknown, C=XX"
            printf "storePassword=anontrace123\nkeyPassword=anontrace123\nkeyAlias=anontrace\nstoreFile=release.jks\n" > key.properties
          fi

      - name: Build Android Release APK
        working-directory: apps/simple_signal_mobile
        run: flutter build apk --release

      - name: Verify APK Output
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="apps/simple_signal_mobile/build/app/outputs/flutter-apk"

          if ! compgen -G "$APK_DIR/*.apk" > /dev/null; then
            echo "::error::No APK files were generated."
            exit 1
          fi

          ls -lh "$APK_DIR"/*.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnonTrace-${{ github.ref_name }}-APK
          path: apps/simple_signal_mobile/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [verify, build]
    runs-on: ubuntu-latest

    # Manual runs build an artifact but do not publish a release.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Checkout Repository with Tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: AnonTrace-${{ github.ref_name }}-APK
          path: dist

      - name: Verify Release Files
        shell: bash
        run: |
          set -euo pipefail

          if ! compgen -G "dist/*.apk" > /dev/null; then
            echo "::error::No APK found for release."
            exit 1
          fi

          ls -lh dist/*.apk

      - name: Prepare Release Notes
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          git tag -l --format='%(contents)' "$TAG_NAME" \
            > release-notes.md

          if [ ! -s release-notes.md ]; then
            git log -1 --format='%B' "$COMMIT_SHA" \
              > release-notes.md
          fi

          if [ ! -s release-notes.md ]; then
            echo "Release $TAG_NAME" > release-notes.md
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AnonTrace ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
